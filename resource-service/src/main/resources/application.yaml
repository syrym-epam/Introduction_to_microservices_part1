spring:
  application:
    name: resource-service
  datasource:
    url: jdbc:postgresql://localhost:5432/resource-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true 
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
song-service:
  url: http://localhost:8081