server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
      gateway:
        mvc:  # <-- Crucial: make sure 'mvc' is included here
          routes:
            - id: resource-route
              uri: lb://RESOURCE-SERVICE
              predicates:
              - Path=/resources, /resources/**
              filters:
              - StripPrefix=0
            - id: song-route
              uri: lb://SONG-SERVICE
              predicates:
              - Path=/songs, /songs/**
              filters:
              - StripPrefix=0
eureka:
  client:
    service-url: 
      defaultZone: "${EUREKA_SERVICE_URL:http://localhost:8761/eureka}"
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5

